name: 功能建议 / Feature request
description: 说明需求、使用情景与预期结果 / Explain the need, use case and expected outcome
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请勿附凭据或私人资料；安全问题走 SECURITY.md 私密渠道 / No credentials or private data; security issues use the private reporting policy
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 使用情景与预期结果 / Use case and desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍 / Alternatives and trade-offs
  - type: textarea
    id: scope
    attributes:
      label: 数据、权限、兼容性或资料来源影响 / Data, permissions, compatibility or content-source impact
