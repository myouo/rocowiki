name: Deploy Wiki API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-wiki-api
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run test:runtime -w @rocowiki/api
      - run: npm run api:dry-run
      - name: Migrate D1, deploy the API and verify its public health
        id: api
        run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          GITHUB_APP_ID: ${{ vars.APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ vars.INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
