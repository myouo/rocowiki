name: Update source snapshots
on:
  schedule:
    # UTC 00:23, 03:23, ...; China time 02:23, 05:23, ..., 23:23.
    - cron: '23 */3 * * *'
    # Daily game collection runs only when its runtime or sanitized input is configured.
    - cron: '41 1 * * *'
    # Friday 06:00 Asia/Shanghai = Thursday 22:00 UTC; refresh ladder XML bans.
    - cron: '0 22 * * 4'
  workflow_dispatch:
    inputs:
      target:
        description: 'Task IDs separated by commas, or all'
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: source-snapshot-update
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # Select by the triggering cron, even when GitHub starts a scheduled job late.
      UPDATE_SCHEDULE: ${{ github.event.schedule }}
      UPDATE_TARGET: ${{ inputs.target || 'all' }}
      # A loopback runtime requires a supervised/self-hosted runner or an SSH tunnel.
      ROCO_GAME_RUNTIME: ${{ vars.ROCO_GAME_RUNTIME }}
      ROCO_GAME_SKILL_CAPTURE_FILE: ${{ vars.ROCO_GAME_SKILL_CAPTURE_FILE }}
      ROCO_GAME_SKILL_PETS: ${{ vars.ROCO_GAME_SKILL_PETS }}
      ROCO_GAME_SKILL_POSITIONS: ${{ vars.ROCO_GAME_SKILL_POSITIONS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Plan updates for this trigger
        id: plan
        run: npm run data:update -- --plan
      - name: Refresh selected public sources
        if: steps.plan.outputs.has_tasks == 'true'
        run: npm run data:update
        env:
          ROCO_GAME_RUNTIME_TOKEN: ${{ secrets.ROCO_GAME_RUNTIME_TOKEN }}
      - name: Detect a data change
        id: data
        if: steps.plan.outputs.has_tasks == 'true'
        run: npm run data:update -- --changes
      - name: Validate the data and regenerate reader baselines
        if: steps.data.outputs.changed == 'true'
        run: |
          npm run data:update -- --validate
          npm run typecheck
          npm run build:baselines -w @rocowiki/web
      - name: Publish a data update PR and start full validation
        if: steps.data.outputs.changed == 'true'
        run: node --import tsx scripts/updates/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
