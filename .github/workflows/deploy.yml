name: Deploy static wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-wiki
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          SITE_URL: ${{ vars.SITE_URL }}
          WIKI_WORKSPACE_MODE: server
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-${{ github.sha }}
          path: apps/web/build
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: wiki-${{ github.sha }}
          path: apps/web/build
      - name: Resolve the account owning the production domain
        id: cloudflare
        run: node --import tsx scripts/resolve-cloudflare-account.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      - name: Deploy verified Workers assets and check the public version
        run: npm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          CLOUDFLARE_ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_RECEIPTS_ENABLED: ${{ vars.DEPLOY_RECEIPTS_ENABLED || 'true' }}
