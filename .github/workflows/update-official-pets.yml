name: Update official pet snapshot
on:
  schedule:
    # UTC 00:23, 03:23, ...; China time 02:23, 05:23, ..., 23:23.
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-pet-snapshot-update
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh from the public official configuration
        run: |
          npm run pets:import
          npm run ladder:import
      - name: Detect a data change
        id: data
        shell: bash
        run: |
          if git diff --quiet -- apps/web/content/official-pets.json apps/web/content/official-ladder.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Official pet and ladder data are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the data and regenerate reader baselines
        if: steps.data.outputs.changed == 'true'
        run: |
          npx vitest run tests/official-pets.test.ts tests/official-pet-refresh.test.ts tests/official-ladder.test.ts
          npm run typecheck
          npm run build:baselines -w @rocowiki/web
      - name: Publish a data update PR and start full validation
        if: steps.data.outputs.changed == 'true'
        run: node --import tsx scripts/publish-official-pet-update.ts
        env:
          GH_TOKEN: ${{ github.token }}
